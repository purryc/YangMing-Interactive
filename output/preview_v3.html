<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书生 v3 · 细节与控制验证</title>
<style>*{box-sizing:border-box}body{margin:0 auto;max-width:1200px;padding:28px;background:#171c20;color:#ece9e1;font:15px system-ui;line-height:1.6}h1,h2{font-weight:550}p{color:#b3b6b6}.notice{background:#493d29;border:1px solid #7f6c49;border-radius:12px;padding:15px;margin:18px 0;color:#eedfc1}main{display:grid;grid-template-columns:minmax(320px,640px) 1fr;gap:24px}video{width:100%;border-radius:16px}button{background:#30383f;color:#e8e3d9;border:1px solid #58636b;border-radius:8px;padding:10px;cursor:pointer}button.active{background:#715d3f}#actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}a{color:#d9c393}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}figure{margin:0;background:#252c32;border-radius:12px;overflow:hidden}figure img{display:block;width:100%}figcaption{padding:10px}small{display:block;color:#a8b0b6}@media(max-width:780px){main{grid-template-columns:1fr}.gallery{grid-template-columns:repeat(2,1fr)}}</style>
<h1>书生 v3 · 细节与控制验证版</h1><p>参考驱动的局部建模、分指绑定、扩展口型与表情。保留 v2；本轮没有追加 Hyper3D 生成。</p><div class="notice">外观验收：仍需修改。眼睑/眉毛有贴合边缘，宽袖及手—胡须接触仍需精修。下面均为真实模型输出，不代表已达到参考图的高保真质量。</div>
<main><video id="video" controls playsinline preload="metadata" src="detail_preview_v3.mp4" poster="../qa/v3/beauty.png"></video><section><button id="full">播放完整 30 秒预览</button><p id="status" role="status">正在加载…</p><div id="actions"></div><p>模型包含 35 个动作/展示片段；视频精选其中 10 段，包含局部特写。</p><a href="scholar_voice_rig_v3.blend">Blender v3 源文件</a><br><a href="scholar_voice_rig_v3.glb">GLB 动画与 Morph</a><br><a href="../README_v3.md">控制名称、接入说明与未通过项</a></section></main>
<h2>口型 · 全零闭嘴 + 11 组</h2><div id="mouth" class="gallery"></div><h2>眼神与眼睑</h2><div id="eyes" class="gallery"></div><h2>情绪姿势</h2><div id="emotion" class="gallery"></div><h2>手脚与身体姿势</h2><div id="detail" class="gallery"></div>
<script>
const v=document.querySelector('video'),status=document.querySelector('#status');let selected=null;
const labels=['待机总览','11 组口型','眼神与眨眼','高兴','生气','握拳特写','V 手势特写','捋胡须','拱手','走路 / 靴子'];
labels.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{selected=i;v.currentTime=i*3;v.play().catch(e=>status.textContent=e.message);};document.querySelector('#actions').append(b);});
document.querySelector('#full').onclick=()=>{selected=null;v.currentTime=0;v.play().catch(e=>status.textContent=e.message);};v.ontimeupdate=()=>{if(selected!==null&&v.currentTime>=(selected+1)*3-.03)v.currentTime=selected*3;const i=Math.min(9,Math.floor(v.currentTime/3));status.textContent=labels[i]+' · '+v.currentTime.toFixed(1)+' / 30 秒';document.querySelectorAll('#actions button').forEach((b,j)=>b.classList.toggle('active',i===j));};v.onloadedmetadata=()=>status.textContent='预览就绪';v.onerror=()=>status.textContent='视频尚未就绪，可先看下方控制对照';
function gallery(id,items){for(const [name,label] of items){const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption');img.src='../qa/v3/'+name+'.png';img.alt=label;img.loading='lazy';c.textContent=label;f.append(img,c);document.querySelector('#'+id).append(f);}}
gallery('mouth',['closed','A','E','I','O','U','MBP','FV','TH','TDNL','CHSHZH','KGNG'].map(n=>['control_'+n,n==='closed'?'闭嘴 · 全部归零':n]));
gallery('eyes',[['blink_L','左眼闭合'],['blink_R','右眼闭合'],['squint','眯眼'],['wide','睁大'],['gaze_L','左看'],['gaze_R','右看'],['gaze_U','上看'],['gaze_D','下看']].map(([n,l])=>['control_'+n,l]));
gallery('emotion',[['Happy','喜'],['Angry','怒'],['Sad','哀'],['Laughing','乐'],['Surprised','惊'],['Thinking','思'],['Proud','得意'],['Helpless','无奈']].map(([n,l])=>['control_expr_'+n,l]));
gallery('detail',[['hand_open','张手'],['hand_fist','握拳'],['hand_point','指向'],['hand_peace','V 手势'],['hand_pinch','捏圈（接触近似）'],['boot_detail','靴筒、沿边与鞋底'],['salute','拱手（接触待精修）'],['stroke_beard','捋胡须（接触待精修）'],['back','背面 / 帽带'],['side','侧面']]);
</script></html>
