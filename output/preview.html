<!doctype html>
<html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>学者 · 语音交互动作</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#181d22;color:#eef0f1;font:16px/1.65 -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:1120px;margin:0 auto;padding:36px 24px;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr);gap:40px}video{display:block;width:100%;border-radius:16px;background:#363c42}small{color:#a8b3bb;letter-spacing:.16em}h1{font-weight:500;font-size:30px;line-height:1.3;margin:16px 0}p{color:#b7c2c9}button{font:inherit;color:inherit;border:1px solid #454e57;background:#252d35;padding:10px 16px;border-radius:8px;cursor:pointer}button:hover,button.active{background:#627f87;border-color:#91bdc8;color:white}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:26px 0}.status{color:#c7d8df;min-height:56px}.foot{font-size:13px;border-top:1px solid #3a444c;padding-top:20px}a{color:#b5d3df}#play{width:100%;margin-top:12px}#error{color:#ffc5ae}@media(max-width:760px){main{grid-template-columns:1fr;gap:18px;padding:20px}h1{font-size:25px}}
</style>
<main><section><video id="video" controls playsinline preload="auto" poster="scholar_voice_beauty.png"><source src="voice_interaction_preview.mp4" type="video/mp4"></video><button id="play">播放完整 18 秒演示</button><p id="error"></p></section><section><small>HYPER3D → BLENDER · V1</small><h1>学者的六种回应</h1><p>以克制的身体、头部和手势动作表达对话状态。选择一个状态，即可单独循环查看。</p><div class="actions" id="actions"></div><div class="status" id="status">准备播放</div><p class="foot">25 根骨骼 · 6 个独立 Action · 24 fps<br>首版交互动作原型。眼睛和嘴部仍为烘焙贴图；讲解为示意节奏，尚未接入音频口型同步。没有布料或毛发物理模拟。</p><p><a href="scholar_voice_rig_v1.blend">Blender 可编辑源文件</a><br><a href="scholar_voice_rig_v1.glb">GLB 模型与动作</a><br><a href="../README.md">交付说明</a></p></section></main>
<script>
const states=[['待机','安静呼吸，轻微重心变化'],['倾听','轻微前倾、侧头，保持关注'],['思考','稍转头，停顿后回正'],['讲解','单手节拍与头部强调'],['点头确认','一次清楚的点头'],['礼貌回应','小幅举手和轻微致意']];
const video=document.querySelector('#video');const status=document.querySelector('#status');let selected=null;
states.forEach((state,i)=>{const b=document.createElement('button');b.textContent=state[0];b.onclick=()=>{selected=i;video.currentTime=i*3;video.play().catch(()=>{});};document.querySelector('#actions').append(b);});
document.querySelector('#play').onclick=()=>{selected=null;video.currentTime=0;video.play().catch(()=>{});};
video.addEventListener('timeupdate',()=>{if(selected!==null&&video.currentTime>=(selected+1)*3-.02)video.currentTime=selected*3;const i=Math.min(5,Math.floor(video.currentTime/3));status.textContent=states[i][0]+' · '+states[i][1];document.querySelectorAll('#actions button').forEach((b,j)=>b.classList.toggle('active',i===j));});
video.addEventListener('error',()=>{document.querySelector('#error').textContent='视频尚未就绪。请等待渲染完成后刷新。';});
</script></html>
