<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>书生 · 语音角色 v2</title>
<style>*{box-sizing:border-box}body{margin:0;background:#161b20;color:#ece5d8;font:16px system-ui;padding:32px;max-width:1120px;margin:auto}h1{font-weight:550;margin:0 0 10px}p{color:#acaea9;line-height:1.7}main{display:grid;grid-template-columns:minmax(300px,640px) 1fr;gap:24px}video{width:100%;border-radius:20px;background:#30363c}button,a{color:inherit}button{border:1px solid #464d52;background:#252d34;padding:12px 16px;border-radius:10px;cursor:pointer;text-align:left}button:hover,button.active{background:#5e5140;border-color:#c4a575}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}.full{width:100%;margin-bottom:12px}#status{min-height:30px}.mouths{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}figure{margin:0}figure img{width:100%;border-radius:10px}figcaption{text-align:center;padding:8px;color:#c7b99e}footer{margin-top:32px;color:#a1a6a8}@media(max-width:800px){main{grid-template-columns:1fr}.mouths{grid-template-columns:repeat(3,1fr)}}</style>
<h1>书生 · 语音角色 v2</h1><p>自然垂手 · 12 组动作 · A / E / I / O / U 几何口型<br>动画原型：视频口型为合成演示节奏，未接入实时语音。</p>
<main><video id="video" src="voice_interaction_preview_v2.mp4" poster="scholar_voice_beauty_v2.png" controls playsinline preload="metadata"></video><section><button class="full" id="full">播放完整 36 秒演示</button><div class="buttons" id="buttons"></div><p id="status" role="status">正在加载预览…</p><p>走路 / 跑步是原地循环；场景位移由应用控制。视频 12 fps，模型动画 24 fps。</p><a href="scholar_voice_rig_v2.blend">下载 Blender 源文件</a><br><br><a href="scholar_voice_rig_v2.glb">下载带骨骼与口型的 GLB</a></section></main>
<h2>口型最大值参考</h2><p>每个口型单独设为 1。所有值为 0 时闭嘴；实际对话使用平滑混合，避免突然切换。</p><div class="mouths" id="mouths"></div><footer><a href="../README_v2.md">操作与实时语音接入说明</a> · 保留了 v1 原文件</footer>
<script>
const labels=['待机','倾听','思考','说话 / 口型特写','点头确认','招呼','走路','跑步','挥手','耸肩','鞠躬','左右看'];
const video=document.querySelector('video'),status=document.querySelector('#status');let selected=null;
labels.forEach((name,i)=>{const b=document.createElement('button');b.textContent=name;b.onclick=()=>{selected=i;video.currentTime=i*3;video.play().catch(e=>status.textContent=e.message);};document.querySelector('#buttons').append(b);});
document.querySelector('#full').onclick=()=>{selected=null;video.currentTime=0;video.play().catch(e=>status.textContent=e.message);};
video.ontimeupdate=()=>{if(selected!==null&&video.currentTime>=(selected+1)*3-.03)video.currentTime=selected*3;const i=Math.min(11,Math.floor(video.currentTime/3));status.textContent=labels[i]+' · '+video.currentTime.toFixed(1)+' / 36.0 秒';document.querySelectorAll('#buttons button').forEach((b,j)=>b.classList.toggle('active',j===i));};
video.onloadedmetadata=()=>status.textContent='预览已就绪，选择动作即可循环';video.onerror=()=>status.textContent='视频尚未就绪；可先查看下方口型与下载模型';
['closed','A','E','I','O','U'].forEach(name=>{const f=document.createElement('figure'),img=document.createElement('img'),c=document.createElement('figcaption');img.src='../qa/v2/viseme_'+name+'.png';img.alt=name==='closed'?'闭嘴':name+' 口型';c.textContent=name==='closed'?'闭嘴 · 全部为 0':name;f.append(img,c);document.querySelector('#mouths').append(f);});
</script></html>
