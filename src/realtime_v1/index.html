<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阳明 · 与书生对话</title><link rel="stylesheet" href="/style.css"><script type="importmap">{"imports":{"three":"/vendor/build/three.module.js","three/addons/":"/vendor/examples/jsm/"}}</script></head>
<body><header><a class="brand" href="/">阳明<span>与书生对话</span></a><span class="edition">实时语音 · 口型试验 01</span></header>
<main><section class="stage"><div class="stage_caption"><span class="dot"></span><span id="model_status">正在请先生入座…</span></div><div id="canvas"></div><div class="view_controls"><button id="portrait">近看口型</button><button id="full">全身</button></div><p class="stage_note">拖动转向 · 滚轮缩放</p></section>
<section class="conversation"><div class="eyebrow">一念之间，知行相遇</div><h1>有话，慢慢说。</h1><p class="intro">聊聊今日的困惑，也可以从一个小问题开始。</p><div class="status"><span id="status_dot" class="dot"></span><span id="status" role="status">正在检查连接…</span></div>
<div class="transcript" id="transcript" aria-live="polite"><p class="hint">开启麦克风，或在下方写下想说的话。<br>先生说话时，口型会跟随实际播放的声音。</p></div>
<div class="suggestions"><button data-prompt="用两句话向我解释，什么是知行合一？">什么是知行合一？</button><button data-prompt="我总是想很多，行动很少，该如何开始？">想得多，做得少</button></div>
<form id="text_form"><input id="text" aria-label="想对先生说的话" placeholder="写下想说的话…" maxlength="2000"><button id="send" type="submit" aria-label="发送">↑</button></form>
<div class="actions"><button class="primary" id="mic">开始语音对话</button><button id="interrupt">打断</button><button id="disconnect">结束</button></div>
<details id="settings"><summary>连接与口型设置</summary><p id="config_note"></p><label>DashScope API Key<input type="password" id="key" autocomplete="off" placeholder="仅用于本次连接，不保存"></label><label>密钥地区<select id="region"><option value="intl-singapore">新加坡</option><option value="cn-beijing">中国北京</option></select></label><label>口型幅度<input id="strength" type="range" min="0.3" max="1.5" step="0.05" value="1"></label><small>声学口型近似：A / E / O 混合。尚未逐字对齐音素。麦克风开启后，语音会发送至 Qwen。</small></details>
<footer>虚构数字书生 · 基于现有 v3 模型<br>眼睑、胡须与衣袖细节仍在打磨。</footer></section></main><script type="module" src="/client.mjs"></script></body></html>
